---
name: renovate

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: 'space-separated list of repositories'
        default: 'voxpupuli/puppet-example'
        required: false
        type: string
  workflow_call:
    inputs:
      repositories:
        description: 'space-separated list of repositories'
        default: 'voxpupuli/puppet-example'
        required: false
        type: string

env:
  RENOVATE_PLATFORM: github
  RENOVATE_GIT_URL: ssh
  RENOVATE_GIT_PRIVATE_KEY: '${{ secrets.PCCI_SSH_PRIVATE_KEY }}'
  RENOVATE_TOKEN: '${{ secrets.PCCI_PAT_MODULESYNC_PR }}'
  RENOVATE_CONFIG_FILE: renovate.js
  LOG_LEVEL: debug
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock
  RENOVATE_GIT_AUTHOR: 'pccibot <12855858+pccibot@users.noreply.github.com>'
  GIT_AUTHOR_NAME: pccibot
  GIT_AUTHOR_EMAIL: 12855858+pccibot@users.noreply.github.com
  GIT_COMMITTER_NAME: pccibot
  GIT_COMMITTER_EMAIL: 12855858+pccibot@users.noreply.github.com

jobs:
  renovate:
    runs-on: ubuntu-latest
    container: ghcr.io/voxpupuli/renovate:latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: renovate
        run: |
            mkdir -p /root/.ssh
            ssh-keyscan github.com > /root/.ssh/known_hosts
            echo "${{ secrets.PCCI_SSH_PRIVATE_KEY }}" > /root/.ssh/id_ed25519
            chmod 600 /root/.ssh/id_ed25519
            ssh-agent -a $SSH_AUTH_SOCK > /dev/null
            ssh-add /root/.ssh/id_ed25519
            git config --global user.email "$GIT_AUTHOR_EMAIL"
            git config --global user.name "$GIT_AUTHOR_NAME"
            git config --global gpg.format ssh
            git config --global user.signingkey /root/.ssh/id_ed25519
            git config --global commit.gpgsign true
            renovate ${{ inputs.repositories }}
